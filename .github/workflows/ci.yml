name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" button in the Actions tab: re-run checks and redeploy main.
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::203342792484:role/github-actions-deploy
  ECR_REPOSITORY: showroom-backend
  EC2_INSTANCE_ID: i-0502d049fa6952fdc
  S3_BUCKET: task-manager-frontend-raulcaian
  CLOUDFRONT_DISTRIBUTION_ID: E17VJTP6PANL48

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: showroom
          POSTGRES_PASSWORD: showroom
          POSTGRES_DB: showroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U showroom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  backend-docker:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t backend:ci ./backend

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Continuous deployment: only after every check passed, only on main.
  # GitHub gets short-lived AWS credentials through OIDC (no stored keys).
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend (ECR + EC2)
    needs: [backend-tests, backend-docker, frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./backend
          docker push --all-tags "$IMAGE"

      - name: Deploy on EC2 through SSM
        env:
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: ./deploy/run-on-ec2.sh

  deploy-frontend:
    name: Deploy frontend (S3 + CloudFront)
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          # Hashed files never change, so browsers may cache them for a year.
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"
          # index.html and the rest must always be revalidated.
          aws s3 sync dist "s3://$S3_BUCKET" --delete --cache-control "no-cache"

      - name: Invalidate the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
