# Local development services. Start with: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: showroom
      POSTGRES_PASSWORD: showroom  # local development only, never reuse on AWS
      POSTGRES_DB: showroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showroom -d showroom"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
